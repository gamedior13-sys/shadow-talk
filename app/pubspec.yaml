name: shadow_talk
description: "Shadow Talk — luyện nói tiếng Anh kiểu shadowing, dùng khi đi xe."
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.0
  just_audio_background: ^0.0.1-beta.17
  record: 5.1.2
  provider: ^6.0.0
  shared_preferences: ^2.0.0
  path_provider: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lessons/lessons.json
    - assets/lessons/audio/daily-a2-chao-hoi/
    - assets/lessons/audio/daily-b1-mua-sam/
    - assets/lessons/audio/daily-b2-cuoi-tuan/
    - assets/lessons/audio/travel-a2-san-bay/
    - assets/lessons/audio/travel-b1-khach-san/
    - assets/lessons/audio/travel-b2-hoi-duong/
    - assets/lessons/audio/work-a2-chao-khach/
    - assets/lessons/audio/work-b1-gia-hang/
    - assets/lessons/audio/work-b2-khieu-nai/
